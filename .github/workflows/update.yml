name: Update TWSE Data

on:
  schedule:
    - cron: '*/10 1-5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Run analyzer
        env:
          STOCK_NO: ${{ secrets.STOCK_NO }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python twse_analyzer.py --months 4

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices_data.js signal_state.json
          git diff --staged --quiet || git commit -m "Auto update"
          git push
